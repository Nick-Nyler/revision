version: '3.8'
services:
  odoo:
    image: odoo:16.0
    ports:
      - "8069:8069"
    volumes:
      - ./ngo_fellow_map:/mnt/extra-addons/ngo_fellow_map
      - odoo-data:/var/lib/odoo
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_HOST=db
    depends_on:
      - db
    command: odoo -d postgres --dev=all --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  odoo-data:
  postgres-data:
